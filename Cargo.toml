[package]
name = "gem"
version = "0.1.0"
edition = "2021"
links = "gem"

[dependencies]
cachedhash = "0.2.0"
clap = { version = "4.5.15", features = ["derive"] }
clilog = { version = "0.2.5", path = "eda-infra-rs/clilog" }
compact_str = "0.7.1"
indexmap = { version = "2.4.0", features = ["rayon"] }
itertools = "0.13.0"
mt-kahypar = { version = "0.2.0", optional = true }
netlistdb = { version = "0.4.6", path = "eda-infra-rs/netlistdb" }
rand = "0.8.5"
rand_chacha = "0.3.1"
rayon = "1.10.0"
serde = { version = "1.0.208", features = ["derive"] }
serde_bare = "0.5.0"
sverilogparse = { version = "0.4.2", path = "eda-infra-rs/sverilogparse" }
tempdir = "0.3.7"
ulib = { version = "0.3.13", path = "eda-infra-rs/ulib" }
vcd-ng = { version = "0.2.0", path = "eda-infra-rs/vcd-ng" }

[build-dependencies]
ucc = { version = "0.2.5", path = "eda-infra-rs/ucc" }

[features]
# The mt-kahypar hypergraph partitioner bundles a large, non-portable C++
# tree (its vendored oneTBB / kahypar-shared-resources do not compile on
# Windows in 0.2.0). It is only needed by `cut_map_interactive`; gate it
# behind a feature so the CPU-only verification path (`cargo build`, the
# `macro_test` / `naive_sim` / `level_test` binaries) builds without a heavy
# C++ toolchain. The CUDA build keeps it, matching the previous behaviour.
partitioner = ["dep:mt-kahypar"]
cuda = ["ulib/cuda", "partitioner"]

[[bin]]
name = "cuda_test"
required-features = ["cuda"]

[[bin]]
name = "cuda_dummy_test"
required-features = ["cuda"]

[[bin]]
name = "cut_map_interactive"
required-features = ["partitioner"]
